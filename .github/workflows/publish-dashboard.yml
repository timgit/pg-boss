# Actions are pinned to full commit SHAs; see .github/dependabot.yml for why and how they are updated.
name: Publish Dashboard Package

on:
  push:
    tags:
      - 'dashboard-*'  # Triggers on tags like dashboard-1.0.0, dashboard-1.0.1, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    container: node:24
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgboss
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install

      - name: Install dashboard dependencies
        working-directory: packages/dashboard
        run: npm install

      - name: Publish to npm
        working-directory: packages/dashboard
        run: npm publish --provenance --access public
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/pgboss
