# Actions are pinned to full commit SHAs; see .github/dependabot.yml for why and how they are updated.
on:
  push:
    branches: [master]
    tags-ignore: ['**']
    paths:
      - 'packages/dashboard/**'
      - 'src/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/dashboard/**'
      - 'src/**'
      - '.github/workflows/dashboard.yml'

name: Dashboard CI

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:24
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          packages/dashboard/package-lock.json

    - name: Install root dependencies
      run: npm ci

    - name: Install dashboard dependencies
      run: npm ci
      working-directory: packages/dashboard

    - name: Typecheck
      run: npm run typecheck
      working-directory: packages/dashboard

    - name: Frontend tests with coverage
      run: npm run cover:frontend
      working-directory: packages/dashboard

    - name: Server tests with coverage
      run: npm run cover:server
      working-directory: packages/dashboard
      env:
        DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
