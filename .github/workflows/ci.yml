name: CI

on:
  push:
    branches: [master]
    tags-ignore: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Pick the toolchain by image rather than `bun upgrade`, which needs unzip that these images
    # do not carry.
    container: oven/bun:${{ matrix.bun }}
    strategy:
      fail-fast: false
      matrix:
        # The bun-driver mode runs on both toolchains, because fromBunSql is the one part of the
        # suite whose behavior depends on Bun itself. The pg-driver suites only run on stable —
        # running them twice buys nothing but minutes.
        include:
          - mode: standard
            bun: '1'
            command: bun run test
          - mode: distributed
            bun: '1'
            command: bun run test:distributed
          - mode: bun-driver
            bun: canary
            command: bun run test:bun
          - mode: bun-driver
            bun: '1'
            command: bun run test:bun
            # Non-blocking: Bun 1.3.x returns a pooled connection to a waiting query before the
            # ROLLBACK that clears its aborted transaction has landed, so an unrelated query fails
            # with 25P02 whenever a transaction block fails under concurrency. That is upstream, not
            # ours — the adapter rolls back before releasing — and it is fixed in 1.4. Kept visible
            # so we notice when stable catches up; see ISSUE.txt.
            optional: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Report bun version
      run: bun --version

    - name: Install
      run: bun install

    - name: Test (${{ matrix.mode }}, bun ${{ matrix.bun }})
      run: ${{ matrix.command }}
      continue-on-error: ${{ matrix.optional == true }}
      env:
        POSTGRES_HOST: postgres

  test-pglite:
    runs-on: ubuntu-latest
    container: oven/bun:1

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install
      run: bun install

    - name: Test (pglite)
      run: bun run test:pglite
