name: CI

on:
  push:
    branches: [master]
    tags-ignore: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Pick the toolchain by image rather than `bun upgrade`, which needs unzip that these images
    # do not carry.
    container: oven/bun:${{ matrix.bun }}
    strategy:
      fail-fast: false
      matrix:
        # The bun-driver mode runs on both toolchains, because fromBunSql is the one part of the
        # suite whose behavior depends on Bun itself. The pg-driver suites only run on stable —
        # running them twice buys nothing but minutes.
        include:
          - mode: standard
            bun: '1'
            command: bun run test
          - mode: distributed
            bun: '1'
            command: bun run test:distributed
          - mode: bun-driver
            bun: canary
            command: bun run test:bun
          - mode: bun-driver
            bun: '1'
            command: bun run test:bun
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Report bun version
      run: bun --version

    - name: Install
      run: bun install

    - name: Test (${{ matrix.mode }}, bun ${{ matrix.bun }})
      run: ${{ matrix.command }}
      env:
        POSTGRES_HOST: postgres

  test-pglite:
    runs-on: ubuntu-latest
    container: oven/bun:1

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install
      run: bun install

    - name: Test (pglite)
      run: bun run test:pglite

  test-sqlite:
    runs-on: ubuntu-latest
    container: oven/bun:${{ matrix.bun }}
    # Job-level, not step-level: a step-level continue-on-error reports the whole job green on
    # failure, hiding canary breakage entirely; job-level keeps the job visibly red while letting
    # the workflow pass.
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        # Like bun-driver, this suite's behavior depends on Bun itself (its sqlite driver), so it
        # runs on both toolchains. Canary is non-blocking until its sqlite driver has a track record.
        include:
          - bun: '1'
          - bun: canary
            optional: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Report bun version
      run: bun --version

    - name: Install
      run: bun install

    - name: Verify Bun sqlite driver behaviors
      run: bun scripts/spike-bun-sqlite.ts

    - name: Test (sqlite, bun ${{ matrix.bun }})
      run: bun run test:sqlite
